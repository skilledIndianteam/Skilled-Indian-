name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Skilled Indian Provider APK
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v6


      # ------------------------------------------------
      # 2. Setup Node.js
      # ------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm


      # ------------------------------------------------
      # 3. Setup Java 21
      # Capacitor 8 Android requires Java 21
      # ------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      # ------------------------------------------------
      # 4. Setup Android SDK
      # ------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ------------------------------------------------
      # 5. Install Android SDK packages
      # ------------------------------------------------
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"


      # ------------------------------------------------
      # 6. Install npm packages
      # ------------------------------------------------
      - name: Install Dependencies
        run: npm install


      # ------------------------------------------------
      # 7. Create Android project
      # ------------------------------------------------
      - name: Create Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android project already exists"
          fi


      # ------------------------------------------------
      # 8. Sync HTML application to Android
      # ------------------------------------------------
      - name: Sync Capacitor
        run: |
          npx cap sync android


      # ------------------------------------------------
      # 9. Make Gradle executable
      # ------------------------------------------------
      - name: Grant Gradle Permission
        run: |
          chmod +x android/gradlew


      # ------------------------------------------------
      # 10. Build Debug APK
      # ------------------------------------------------
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon


      # ------------------------------------------------
      # 11. Rename APK
      # ------------------------------------------------
      - name: Prepare APK
        run: |
          mkdir -p apk-output

          cp android/app/build/outputs/apk/debug/app-debug.apk \
             apk-output/Skilled-Indian-Provider.apk


      # ------------------------------------------------
      # 12. Upload APK to GitHub Actions
      # ------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Skilled-Indian-Provider-APK
          path: apk-output/Skilled-Indian-Provider.apk
          if-no-files-found: error
